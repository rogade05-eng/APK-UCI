name: Build Android debug APK

on:
  push:
    branches:
      - arena/f8588255-apk-uci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble non-clinical debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Smoke test APK on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.uciasistant.app/.MainActivity
            sleep 5
            test -n "$(adb shell pidof org.uciasistant.app)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: uci-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
