name: Build Android debug APK

on:
  push:
    branches:
      - arena/f8588255-apk-uci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble non-clinical debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not configured}}"
          test -s "$apk"
          "$sdk/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$("$sdk/build-tools/35.0.0/aapt" dump badging "$apk")"
          grep -F "package: name='org.uciasistant.app'" <<< "$badging"
          grep -F "launchable-activity: name='org.uciasistant.app.MainActivity'" <<< "$badging"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: uci-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
